[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anjaneeya"
version = "0.1.0"
description = "ANJANEYA - NIFTY50 Options AI Research Engine (research and backtesting only, not a live trading system)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
dependencies = [
    # --- core numerics ---
    "numpy>=1.26",
    # pandas is pinned below 3.0 deliberately: ANJANEYA targets stable,
    # well-tested research semantics (no copy-on-write / string-dtype
    # behaviour changes introduced in pandas 3.x).
    "pandas>=2.2,<3.0",
    "scipy>=1.11",
    # --- storage ---
    "duckdb>=1.1",
    "pyarrow>=16.0",
    # --- config / validation ---
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # --- logging ---
    "loguru>=0.7",
    # --- data source (Zerodha Kite Connect) ---
    "kiteconnect>=5.0",
    "pyotp>=2.9",
    "requests>=2.31",
    # --- timezone database -------------------------------------------------
    # Windows does not ship the IANA tz database, so `zoneinfo.ZoneInfo`
    # cannot resolve "Asia/Kolkata" without this package. Verified on the
    # target machine. This is a hard runtime dependency, not optional.
    "tzdata>=2024.1",
    # --- ML / visualisation (used from Phase 16 onwards) ---
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.5",
]
explain = [
    "shap>=0.45",
]
# The operator console (scripts/anj_ui.py). Deliberately optional: the capture
# session, the engine and the AI app must never need a web framework, and a
# headless box should not have to install one.
ui = [
    "streamlit>=1.36",
]

[project.scripts]
anjaneeya-capture = "apps.anjaneeya_capture.run:main"
anjaneeya-engine = "apps.anjaneeya_engine.run:main"
anjaneeya-ai = "apps.anjaneeya_ai.run:main"

[tool.setuptools.packages.find]
include = ["core*", "apps*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["."]
markers = [
    "unit: fast, fully offline unit test (default)",
    "integration: exercises multiple modules together (still offline)",
    "live: requires real Zerodha credentials and network access (skipped unless ANJANEYA_RUN_LIVE=1)",
]
filterwarnings = [
    "error::DeprecationWarning:core.*",
]

[tool.coverage.run]
source = ["core", "apps"]
branch = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]
